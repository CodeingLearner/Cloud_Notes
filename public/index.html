<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CloudNotes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Tailwind via CDN: no build step, so the compute layer only serves static files. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } },
    };
  </script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">

  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4 sm:px-6">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-slate-900 text-lg text-white" aria-hidden="true">☁</div>
        <div>
          <h1 class="text-base font-semibold leading-tight">CloudNotes</h1>
        </div>
      </div>
      <!-- Live status from GET /health on the compute layer -->
      <div id="status" class="flex items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs text-slate-600" role="status">
        <span id="status-dot" class="h-2 w-2 rounded-full bg-slate-300"></span>
        <span id="status-text">Checking server…</span>
      </div>
    </div>
  </header>

  <main class="mx-auto grid max-w-6xl gap-6 px-4 py-8 sm:px-6 lg:grid-cols-[340px_1fr]">

    <!-- Create note -->
    <aside class="lg:sticky lg:top-6 lg:self-start">
      <form id="note-form" class="space-y-4 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
        <h2 class="text-sm font-semibold">New note</h2>

        <div>
          <label for="title" class="mb-1 block text-xs font-medium text-slate-600">Title</label>
          <input id="title" name="title" type="text" required maxlength="120" placeholder="e.g. S3 vs EBS trade-offs"
            class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-200" />
        </div>

        <div>
          <label for="content" class="mb-1 block text-xs font-medium text-slate-600">Content</label>
          <textarea id="content" name="content" rows="5" required maxlength="5000" placeholder="Write your note…"
            class="w-full resize-y rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-200"></textarea>
        </div>

        <div>
          <label for="tag" class="mb-1 block text-xs font-medium text-slate-600">Tag</label>
          <select id="tag" name="tag"
            class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-200">
            <option>General</option>
            <option>Academics</option>
            <option>Cloud Arch</option>
            <option>Code Snippets</option>
          </select>
        </div>

        <button id="submit-btn" type="submit"
          class="flex w-full items-center justify-center gap-2 rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60">
          <svg id="submit-spinner" class="hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"></circle>
            <path d="M4 12a8 8 0 018-8" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="opacity-75"></path>
          </svg>
          <span id="submit-label">Save note</span>
        </button>
      </form>
    </aside>

    <!-- Notes -->
    <section aria-label="Notes">
      <div class="mb-4 space-y-3">
        <div class="relative">
          <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="9" cy="9" r="6"></circle><path d="M14 14l4 4" stroke-linecap="round"></path>
          </svg>
          <input id="search" type="search" placeholder="Search titles and content" aria-label="Search notes"
            class="w-full rounded-lg border border-slate-200 bg-white py-2 pl-9 pr-3 text-sm placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-200" />
        </div>
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div id="filters" class="flex flex-wrap gap-2" role="group" aria-label="Filter by tag"></div>
          <p id="count" class="text-xs text-slate-500" aria-live="polite"></p>
        </div>
      </div>

      <div id="notes" class="grid gap-4 sm:grid-cols-2"></div>
    </section>
  </main>

  <!-- Toast -->
  <div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-50 -translate-x-1/2 translate-y-2 rounded-lg px-4 py-2.5 text-sm font-medium text-white opacity-0 shadow-lg transition" role="status" aria-live="polite"></div>

<script>
  const TAGS = ['Academics', 'Cloud Arch', 'Code Snippets', 'General'];

  // Colour per tag. Full class names are written out so Tailwind's CDN can see them.
  const TAG_STYLES = {
    'Academics':     'bg-indigo-50 text-indigo-700 ring-indigo-200',
    'Cloud Arch':    'bg-sky-50 text-sky-700 ring-sky-200',
    'Code Snippets': 'bg-emerald-50 text-emerald-700 ring-emerald-200',
    'General':       'bg-slate-100 text-slate-600 ring-slate-200',
  };

  const state = { tag: 'All', search: '' };
  let requestId = 0; // Ignore stale responses when the user types quickly.

  const $ = (id) => document.getElementById(id);
  const els = {
    form: $('note-form'), submit: $('submit-btn'), spinner: $('submit-spinner'), label: $('submit-label'),
    search: $('search'), filters: $('filters'), notes: $('notes'), count: $('count'),
    toast: $('toast'), statusDot: $('status-dot'), statusText: $('status-text'),
  };

  /* ---------- helpers ---------- */

  // Note content is user-supplied, so it is always escaped before going into innerHTML.
  const escapeHtml = (value) =>
    String(value).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const formatDate = (iso) =>
    new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(iso));

  let toastTimer;
  function showToast(message, isError = false) {
    els.toast.textContent = message;
    els.toast.className =
      'pointer-events-none fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-lg px-4 py-2.5 text-sm font-medium text-white opacity-100 shadow-lg transition ' +
      (isError ? 'bg-red-600' : 'bg-slate-900');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      els.toast.classList.replace('opacity-100', 'opacity-0');
    }, 3500);
  }

  async function api(url, options) {
    const res = await fetch(url, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  /* ---------- server status (GET /health) ---------- */

  function formatUptime(seconds) {
    if (seconds < 60) return `${seconds}s`;
    if (seconds < 3600) return `${Math.floor(seconds / 60)}m`;
    return `${Math.floor(seconds / 3600)}h ${Math.floor((seconds % 3600) / 60)}m`;
  }

  async function checkHealth() {
    try {
      const h = await api('/health');
      const dbOk = h.database === 'connected';
      els.statusDot.className = `h-2 w-2 rounded-full ${dbOk ? 'bg-emerald-500' : 'bg-amber-500'}`;
      els.statusText.textContent = `Server up ${formatUptime(h.uptime)} · DB ${h.database}`;
    } catch {
      els.statusDot.className = 'h-2 w-2 rounded-full bg-red-500';
      els.statusText.textContent = 'Server unreachable';
    }
  }

  /* ---------- filter chips ---------- */

  function renderFilters() {
    els.filters.innerHTML = ['All', ...TAGS]
      .map((tag) => {
        const active = state.tag === tag;
        const cls = active
          ? 'bg-slate-900 text-white border-slate-900'
          : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100';
        return `<button type="button" data-tag="${escapeHtml(tag)}" aria-pressed="${active}"
          class="rounded-full border px-3 py-1 text-xs font-medium transition focus:outline-none focus:ring-2 focus:ring-slate-300 ${cls}">${escapeHtml(tag)}</button>`;
      })
      .join('');
  }

  els.filters.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-tag]');
    if (!btn) return;
    state.tag = btn.dataset.tag;
    renderFilters();
    loadNotes();
  });

  /* ---------- notes ---------- */

  function noteCard(note) {
    const tagStyle = TAG_STYLES[note.tag] || TAG_STYLES.General;

    return `
      <article class="flex flex-col rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
        <div class="mb-3 flex items-start justify-between gap-3">
          <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium ring-1 ring-inset ${tagStyle}">${escapeHtml(note.tag)}</span>
          <button type="button" data-delete="${escapeHtml(note._id)}" aria-label="Delete note ${escapeHtml(note.title)}"
            class="rounded-md p-1 text-slate-400 transition hover:bg-red-50 hover:text-red-600 focus:outline-none focus:ring-2 focus:ring-red-200 disabled:opacity-50">
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10"></path>
            </svg>
          </button>
        </div>
        <h3 class="text-base font-semibold leading-snug text-slate-900">${escapeHtml(note.title)}</h3>
        <p class="mt-2 whitespace-pre-wrap break-words text-sm leading-relaxed text-slate-600">${escapeHtml(note.content)}</p>
        <p class="mt-auto pt-4 text-xs text-slate-400">${escapeHtml(formatDate(note.createdAt))}</p>
      </article>`;
  }

  function skeletons() {
    return Array.from({ length: 4 }, () =>
      `<div class="h-40 animate-pulse rounded-xl border border-slate-200 bg-white"></div>`).join('');
  }

  async function loadNotes() {
    const id = ++requestId;
    els.notes.innerHTML = skeletons();
    const params = new URLSearchParams();
    if (state.tag !== 'All') params.set('tag', state.tag);
    if (state.search) params.set('search', state.search);

    try {
      const notes = await api(`/api/notes?${params}`);
      if (id !== requestId) return; // A newer request superseded this one.
      els.count.textContent = `${notes.length} ${notes.length === 1 ? 'note' : 'notes'}`;
      els.notes.innerHTML = notes.length
        ? notes.map(noteCard).join('')
        : `<div class="col-span-full rounded-xl border border-dashed border-slate-300 bg-white p-10 text-center">
             <p class="text-sm font-medium text-slate-700">${state.search || state.tag !== 'All' ? 'No notes match your filters' : 'No notes yet'}</p>
             <p class="mt-1 text-sm text-slate-500">${state.search || state.tag !== 'All' ? 'Try a different search or tag.' : 'Write your first note using the form.'}</p>
           </div>`;
    } catch (err) {
      if (id !== requestId) return;
      els.count.textContent = '';
      els.notes.innerHTML = `<div class="col-span-full rounded-xl border border-red-200 bg-red-50 p-6 text-sm text-red-700">Could not load notes: ${escapeHtml(err.message)}</div>`;
    }
  }

  // Real-time search: debounce keystrokes so we don't query Atlas on every letter.
  let searchTimer;
  els.search.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.search = els.search.value.trim();
      loadNotes();
    }, 250);
  });

  /* ---------- create ---------- */

  function setSubmitting(isSubmitting) {
    els.submit.disabled = isSubmitting;
    els.spinner.classList.toggle('hidden', !isSubmitting);
    els.label.textContent = isSubmitting ? 'Saving…' : 'Save note';
  }

  els.form.addEventListener('submit', async (e) => {
    e.preventDefault();
    setSubmitting(true);
    try {
      await api('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: $('title').value,
          content: $('content').value,
          tag: $('tag').value,
        }),
      });
      els.form.reset();
      showToast('Note saved');
      await loadNotes();
    } catch (err) {
      showToast(err.message, true);
    } finally {
      setSubmitting(false);
    }
  });

  /* ---------- delete ---------- */

  els.notes.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-delete]');
    if (!btn) return;
    if (!confirm('Delete this note? This cannot be undone.')) return;

    btn.disabled = true;
    try {
      await api(`/api/notes/${btn.dataset.delete}`, { method: 'DELETE' });
      showToast('Note deleted');
      await loadNotes();
    } catch (err) {
      btn.disabled = false;
      showToast(err.message, true);
    }
  });

  /* ---------- init ---------- */

  renderFilters();
  loadNotes();
  checkHealth();
  setInterval(checkHealth, 30000);
</script>
</body>
</html>
